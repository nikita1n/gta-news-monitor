name: GTA news monitor

on:
  schedule:
    # every 15 minutes, off the top of the hour: GitHub delays scheduled runs most at :00
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write # to commit state.json back

concurrency:
  group: monitor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: node monitor.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        # also after a failed send, so posts that did go out are not sent twice
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet || { git commit -m 'Update state' && git push; }
